<!DOCTYPE html>
<html>

<script src="https://cdn.jsdelivr.net/npm/simply-beautiful@latest/dist/index.min.js"></script>
<body>

<form id="data-form">
  <label for="type">Select a type:</label>
  <select name="type" id="type">
    <option value="heading">heading</option>
    <option value="information">information</option>
    <option value="input_text">input_text</option>
    <option value="input_date">input_date</option>
    <option value="radio">radio</option>
    <option value="select">select</option>
    <option value="checkbox">checkbox</option>
    <option value="button">button</option>
  </select>
  <p>name:</p>
  <input type="text" name="name" required>
  <p>description:</p>
  <input type="text" name="description" required>
  <button type="submit" name="Parse">Parse the element to json</button>
</form>

<button onclick="downloadPrototype()">download the contents</button>

<pre id="output-parser"></pre>

</body>
<script type="text/javascript">
  var beautify = SimplyBeautiful(); // The script above exposes the global variable 'SimplyBeautiful'

  var content = [];
  var layout = ""


  const form = document.getElementById('data-form');
  form.addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent default form submission
    const formData = new FormData(form);
    const jsonData = Object.fromEntries(formData);
    content.push(jsonData);
    if(layout !== "") {
      layout += " " + formData.get("name");
    } else {
      layout += formData.get("name");
    }
    console.log(layout);
    document.getElementById('output-parser').innerHTML = JSON.stringify(content, null, 2);
    document.getElementById("data-form").reset();
  });


  function downloadPrototype() {
    downloadFile(content ,"content.json");
    downloadFile({type: "layout", grid: [[layout]]}, "layout.json");
  }


  function downloadFile(fileContent, fileName) {
    const blob = new Blob([JSON.stringify(fileContent, null, 2)], { type: 'application/json' }); // Specify the file type
    const url = URL.createObjectURL(blob); // Create a URL for the blob
    const a = document.createElement('a'); // Create an anchor element
    a.href = url; // Set the URL as the href of the anchor
    a.download = fileName; // Set the filename for the download
    document.body.appendChild(a); // Append the anchor to the document
    a.click(); // Programmatically click the anchor to trigger the download
    document.body.removeChild(a); // Remove the anchor from the document
    URL.revokeObjectURL(url); // Revoke the object URL after downloading
}


</script>

</html>
